name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 platform
        run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Verify wrapper
        run: chmod +x gradlew
      - name: Compile and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
